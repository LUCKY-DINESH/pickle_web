<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpiceCraft | Premium Indian Pickles</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body style="background-color: var(--bg-color);">

<!-- Main Top Nav -->
<div class="top-nav w-100 shadow-sm m-0">
    <a href="index.html" class="nav-brand text-decoration-none">
        <i class="fas fa-pepper-hot" style="color: var(--amazon-orange);"></i> SpiceCraft
        <span class="fs-6 text-white fw-medium" style="border: 1px solid white; padding: 2px 5px; border-radius: 4px; margin-left: 10px;">.in</span>
    </a>
    
    <!-- Functional Search Bar (Amazon Style) -->
    <div class="flex-grow-1 mx-3 d-none d-md-flex" style="max-width: 600px;">
        <input type="text" id="searchInput" class="form-control shadow-sm px-4" placeholder="Live Search: Type a pickle name or flavor..." style="border-radius: 50px; border: 1px solid var(--border-color);">
    </div>

    <div class="nav-actions d-flex align-items-center gap-3" id="navActions">
        <!-- Injected via JS -->
    </div>
</div>

<!-- Secondary Nav (Category filter) -->
<div class="sub-nav w-100 shadow-sm mx-0">
    <button class="filter-btn active" data-filter="all"><i class="fas fa-bars"></i> All</button>
    <button class="filter-btn" data-filter="veg">Vegetarian <span class="badge bg-success ms-1"><i class="fas fa-leaf"></i></span></button>
    <button class="filter-btn" data-filter="non-veg">Non-Veg <span class="badge bg-danger ms-1"><i class="fas fa-drumstick-bite"></i></span></button>
</div>

<!-- Big Hero Banner -->
<header class="hero-section w-100">
    <h1>Great Indian Festival</h1>
    <p class="text-white mt-2" style="font-size: 1.2rem; font-weight: 500;">Up to 40% OFF on all handcrafted, authentic pickles. Free Delivery.</p>
</header>

<div class="container position-relative" style="max-width: 1400px; padding: 0 20px;">
    <div id="pickle-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4 mb-5">
        <!-- Pickles injected here -->
    </div>
</div>

<!-- Professional Toast Notification Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
  <div id="actionToast" class="toast align-items-center text-white bg-success border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex p-1">
      <div class="toast-body fs-6" id="toastMessage">
        Success Action!
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token = localStorage.getItem("token");

async function initNav() {
    const navActions = document.getElementById("navActions");
    let cartCount = 0;

    // Fast background fetch for cart count if logged in
    if (token) {
        try {
            const req = await fetch("http://127.0.0.1:8000/orders/cart/", {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (req.ok) {
                const items = await req.json();
                cartCount = items.reduce((acc, it) => acc + (it.quantity || 1), 0);
            }
        } catch (e) {
            console.error(e);
        }

        const role = localStorage.getItem('role');
        const adminBtn = (role === 'admin') ? `<a href="admin.html" class="btn-amazon-secondary me-2 text-decoration-none"><i class="fas fa-tachometer-alt"></i> Admin Panel</a>` : '';

        navActions.innerHTML = `
            ${adminBtn}
            <a href="cart.html" class="text-decoration-none text-white position-relative me-4 d-flex align-items-end pe-2" style="font-size: 0.9rem; font-weight: 700;">
                <span class="position-absolute top-0 start-50 translate-middle badge rounded-pill" style="background-color: var(--amazon-orange); color: #111;" id="cartBadge">${cartCount > 0 ? cartCount : '0'}</span>
                <i class="fas fa-shopping-cart fa-2x"></i> <span class="ms-1 pb-1">Cart</span>
            </a>
            <button onclick="logout()" class="btn-amazon-secondary"><i class="fas fa-sign-out-alt"></i></button>
        `;
    } else {
        navActions.innerHTML = `
            <a href="login.html" class="text-decoration-none text-white position-relative me-3 d-flex align-items-end" style="font-size: 0.9rem; font-weight: 700;">
                <i class="fas fa-shopping-cart fa-2x"></i> <span class="ms-1 pb-1">Cart</span>
            </a>
            <a href="login.html" class="btn-amazon text-decoration-none"><i class="fas fa-user-circle"></i> Login</a>
        `;
    }
}

function logout() {
    localStorage.removeItem("token");
    window.location.reload();
}

function showToast(message, isError = false) {
    const toastEl = document.getElementById("actionToast");
    const toastBody = document.getElementById("toastMessage");
    
    toastEl.className = `toast align-items-center text-white border-0 ${isError ? 'bg-danger' : 'bg-success'}`;
    toastBody.innerHTML = message;
    
    const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
    toast.show();
}

let allPickles = [];

async function loadPickles() {
    try {
        const res = await fetch("http://127.0.0.1:8000/pickles/list/");
        allPickles = await res.json();
        renderPickles('all');
    } catch (e) {
        document.getElementById("pickle-list").innerHTML = `<div class="col-12 text-center text-danger"><p>Could not connect to the backend server. Make sure it is running!</p></div>`;
    }
}

function renderPickles(filterObj = 'all', searchQuery = '') {
    const container = document.getElementById("pickle-list");
    container.innerHTML = "";
    
    let filtered = allPickles;
    
    // Process Category
    if (filterObj === 'veg') {
        filtered = filtered.filter(p => p.category && p.category.toLowerCase() === 'veg');
    } else if (filterObj === 'non-veg') {
        filtered = filtered.filter(p => p.category && p.category.toLowerCase() === 'non-veg');
    }
    
    // Process Search Query
    if (searchQuery.trim() !== '') {
        const query = searchQuery.toLowerCase().trim();
        filtered = filtered.filter(p => 
            (p.name && p.name.toLowerCase().includes(query)) || 
            (p.description && p.description.toLowerCase().includes(query))
        );
    }

    if (filtered.length === 0) {
        container.innerHTML = `<div class="col-12 text-center text-muted py-5">
            <i class="fas fa-box-open fa-4x mb-3 text-secondary opacity-50"></i>
            <h4 class="text-secondary">No pickles found in this category.</h4>
        </div>`;
        return;
    }

    filtered.forEach(p => {
        const isVeg = p.category && p.category.toLowerCase() === 'veg';
        const badgeClass = isVeg ? 'badge-veg' : 'badge-nonveg';
        const badgeIcon = isVeg ? '<i class="fas fa-circle"></i>' : '<i class="fas fa-caret-up"></i>';
        const catText = p.category || 'N/A';

        container.innerHTML += `
        <div class="col">
            <div class="amazon-card position-relative">
                <img src="${p.image_url}" alt="${p.name}">
                <div class="mt-3 d-flex flex-column" style="flex-grow: 1;">
                    <h5 class="card-title text-dark">${p.name}</h5>
                    <div class="d-flex align-items-center mb-1 mt-1">
                        <span class="${badgeClass} me-2">${badgeIcon} <span class="text-uppercase">${catText}</span></span>
                    </div>
                    <p class="text-muted mb-2" style="font-size: 0.85rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1;">${p.description}</p>
                    <div class="mb-2">
                        <span class="prime-badge"><i class="fas fa-check prime-check"></i> prime</span> <span style="font-size: 0.8rem; color: #565959;">Get it by tomorrow</span>
                    </div>
                    <div class="price-block mb-3">
                        <span class="price-symbol">₹</span>${p.price.toLocaleString('en-IN')}
                    </div>
                    <div class="mt-auto">
                        <button class="btn-amazon w-100 shadow-sm border-0" onclick="addToCart('${p._id.$oid || p._id}')">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        </div>`;
    });
}

// Variables to hold active states combined
let currentCategoryFilter = 'all';

// Attach filtering logic to the buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        const targetBtn = e.target.closest('button');
        currentCategoryFilter = targetBtn.dataset.filter;
        
        // Amazon subnav logic: Just add 'active' class
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('active');
        });
        targetBtn.classList.add('active');
        
        const currentSearch = document.getElementById('searchInput').value;
        renderPickles(currentCategoryFilter, currentSearch);
    });
});

// Attach live search logic
const sInput = document.getElementById('searchInput');

sInput.addEventListener('input', (e) => {
    renderPickles(currentCategoryFilter, e.target.value);
});

async function addToCart(id) {
    if (!token) {
        showToast(`<i class="fas fa-exclamation-triangle"></i> Please login to add items to your cart!`, true);
        setTimeout(() => window.location.href = "login.html", 1500);
        return;
    }
    
    try {
        const res = await fetch(`http://127.0.0.1:8000/orders/add_to_cart/${id}`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` }
        });
        
        if (res.ok) {
            showToast(`<i class="fas fa-check-circle"></i> Successfully added to cart!`);
            // Dynamically increment cart badge without refreshing page
            const badge = document.getElementById("cartBadge");
            if(badge) {
                let currentVal = parseInt(badge.innerText) || 0;
                badge.innerText = currentVal + 1;
                badge.classList.remove("d-none");
            }
        } else {
            showToast(`<i class="fas fa-times-circle"></i> Failed to add to cart!`, true);
        }
    } catch(err) {
        showToast(`<i class="fas fa-wifi"></i> Connection failed. Check server status.`, true);
    }
}

// Initializing hooks
initNav();
loadPickles();
</script>
</body>
</html>
